name: Monitor Contribuciones

on:
  schedule:
    # Corre los Lunes a las 8:00 AM Chile (11:00 UTC)
    - cron: '0 11 * * 1'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_DESTINO: ${{ secrets.WA_DESTINO }}
        run: python monitor_contribuciones.py
